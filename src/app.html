<!doctype html>
<html lang="de-CH" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#141619" />
		<!-- Darstellung vor dem ersten Zeichnen setzen; Regel wie resolveTheme() in src/lib/theme/theme.ts -->
		<script>
			try {
				var t = localStorage.getItem('probelokal.theme');
				if (t === 'light') {
					document.documentElement.dataset.theme = 'light';
					document.querySelector('meta[name="theme-color"]').content = '#F2EFE9';
				}
			} catch (e) {}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-32.png"
			sizes="32x32"
			type="image/png"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Probelokal" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
